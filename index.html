<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;700&display=swap" rel="stylesheet"
    />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Oldagram</title>
    </head>
    <body>
        <section class = "app-container">

            <header class = top>
                <img class= "logo" src="images/logo.png">
                <img class = "user-avt" src = "images/user-avt.jpg">
            </header>
            
            <section class = "post">
                <div class = "info">
                    <img class  = "avatar" src = "images/avatar-vangogh.jpg">
                    <div>
                        <div><span class = "name bold">Vincent van Gogh</span></div>
                        <span class="location">Zundert, Netherlands</span>
                    </div>
                </div>

                <section>
                    <img class="img" src="images/post-vangogh.jpg">
                </section>

                <section class = "like-commnent">
                    <img class = "icon heart" src="images/icon-heart.png" alt = "Icon heart">
                    <img class = "icon" src = "images/icon-comment.png" alt = "Icon comment">
                    <img class = "icon" src = "images/icon-dm.png" alt = "Icon dm">
                    
                    <p class = "like-count bold">21,924 likes</p>
                    <div class = "comment">
                        <p class = "other bold">Monet <span class= "small">That is crazy bro</span>
                        </p>
                    </div>
                </section>
            </section>

        </section>

        

        <script src="index.js"></script>
    </body>
</html>
